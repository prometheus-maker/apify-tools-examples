name: Publish to MCP Registry
# Lists each tool in mcp/*/server.json in the official MCP Registry (registry.modelcontextprotocol.io).
# Remote-only entries: each points at Apify's hosted MCP endpoint for one of my Actors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mcp/**"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC proves the io.github.prometheus-maker namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish every server
        run: |
          set +e; fail=0
          for d in mcp/*/; do
            echo "::group::$d"
            out=$(cd "$d" && ../../mcp-publisher publish 2>&1); rc=$?; echo "$out"
            # an unchanged entry is already there: bump "version" in its server.json to update it
            if [ $rc -ne 0 ] && ! grep -qi "already exists\|duplicate" <<<"$out"; then echo "::error::$d failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
